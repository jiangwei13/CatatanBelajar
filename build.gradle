// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        maven {
            url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/'
        }

        // 添加 JUnit 的 SNAPSHOT 仓库
        maven {
            url 'https://oss.sonatype.org/content/repositories/snapshots/'
        }

        // 或者使用 Maven Central 的 SNAPSHOT 仓库
        maven {
            url 'https://s01.oss.sonatype.org/content/repositories/snapshots/'
        }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url "https://jitpack.io" }
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }

    }
    dependencies {
//        classpath 'com.github.megatronking.stringfog:gradle-plugin:5.0.0'
        classpath 'com.github.Petterpx.walle:plugin:1.0.5'

        classpath "com.github.liujingxing:XmlClassGuard:1.2.5"
        classpath "com.github.CodingGay:BlackObfuscator-ASPlugin:3.7"
        classpath 'com.github.megatronking.stringfog:gradle-plugin:5.2.0'
        // 选用加解密算法库，默认实现了xor算法，也可以使用自己的加解密库。
        classpath 'com.github.megatronking.stringfog:xor:5.0.0'
        classpath "com.github.qq549631030:android-junk-code:1.1.2"
    }
}

plugins {
//    alias(libs.plugins.android.application) apply false
//    alias(libs.plugins.android.library) apply false
    id 'com.android.application' version '8.1.4' apply false
    id 'com.android.library' version '8.1.4' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.0' apply false
    id 'com.google.gms.google-services' version '4.4.4' apply false

}

